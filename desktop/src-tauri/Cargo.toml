[package]
name = "aegis-desktop"
version = "0.1.0"
description = "AEGIS local desktop shell"
authors = ["AEGIS-COGNITION Team"]
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
rfd = "0.15.4"
