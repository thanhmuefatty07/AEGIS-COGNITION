[package]
name = "aegis-sandbox"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
license-file = "../../LICENSE.txt"
description = "AEGIS restricted execution policy and state runtime"

[lib]
name = "aegis_sandbox"
crate-type = ["rlib"]

[dependencies]
blake3 = "1.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
