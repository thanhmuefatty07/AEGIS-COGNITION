[package]
name = "aegis-sandbox"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
description = "AEGIS restricted execution policy and state runtime"

[lib]
name = "aegis_sandbox"
crate-type = ["rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
anyhow = "1"
blake3 = "1.5.0"
pyo3 = { version = "0.29.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "time"] }
