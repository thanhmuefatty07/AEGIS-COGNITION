[package]
name = "aegis-search-sdk"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Programmable AEGIS search primitives and pipeline orchestration"

[lib]
name = "aegis_search_sdk"
crate-type = ["rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
aegis-nerve = { path = "../../core/rust", version = "0.1.0" }
aho-corasick = "1.1.2"
anyhow = "1"
blake3 = "1.5.0"
futures = "0.3"
pyo3 = { version = "0.29.2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "time"] }
url = "2"

[dev-dependencies]
aegis-evidence = { path = "../aegis-evidence", version = "0.1.0" }
aegis-sandbox = { path = "../aegis-sandbox", version = "0.1.0" }
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "search_bench"
harness = false
