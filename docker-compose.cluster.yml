version: "3.8"

# Single-host Docker bridge topology for local worker smoke tests.
#
# The coordinator and all workers run under one Docker engine. This
# exercises container-to-container TCP over a bridge; it does not prove
# cross-host behavior or satisfy the NV-016 multi-machine soak contract.
#
# Usage:
#   docker compose -p aegis-cluster-test -f docker-compose.cluster.yml up -d --build
#   docker network inspect aegis-cluster-test_aegis-cluster
# Run --write-capture only with endpoints on separate, verified hosts.

networks:
  aegis-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  coordinator:
    image: python:3.12-alpine
    container_name: aegis-coordinator
    profiles: ["orchestrator"]
    working_dir: /capture
    volumes:
      - ./artifacts:/capture/artifacts
      - ./scripts:/capture/scripts:ro
      - ./cluster:/capture/cluster:ro
    command: ["sleep", "infinity"]
    networks:
      aegis-cluster:
        ipv4_address: 172.20.0.10

  worker-1:
    image: aegis-cognition/cluster-worker:worker-1
    container_name: aegis-worker-1
    build:
      context: .
      dockerfile: cluster/Dockerfile.cluster
    environment:
      - AEGIS_CLUSTER_ROLE=worker
      - AEGIS_WORKER_ID=worker-1
      - AEGIS_WORKER_PORT=9000
    networks:
      aegis-cluster:
        ipv4_address: 172.20.0.11
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  worker-2:
    image: aegis-cognition/cluster-worker:worker-2
    container_name: aegis-worker-2
    build:
      context: .
      dockerfile: cluster/Dockerfile.cluster
    environment:
      - AEGIS_CLUSTER_ROLE=worker
      - AEGIS_WORKER_ID=worker-2
      - AEGIS_WORKER_PORT=9000
    networks:
      aegis-cluster:
        ipv4_address: 172.20.0.12
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  worker-3:
    image: aegis-cognition/cluster-worker:worker-3
    container_name: aegis-worker-3
    build:
      context: .
      dockerfile: cluster/Dockerfile.cluster
    environment:
      - AEGIS_CLUSTER_ROLE=worker
      - AEGIS_WORKER_ID=worker-3
      - AEGIS_WORKER_PORT=9000
    networks:
      aegis-cluster:
        ipv4_address: 172.20.0.13
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
