[package]
name = "semantic_cache_poc"
version = "0.1.0"
edition = "2024"

[lib]
name = "semantic_cache_poc"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python-extension = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
