[package]
name = "semantic_cache_poc"
version = "0.1.0"
edition = "2021"

[lib]
name = "semantic_cache_poc"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22.6", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
