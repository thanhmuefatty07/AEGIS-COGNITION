[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "aegis-cognition"
version = "0.1.0"
description = "Cryptographically-verified AI agent harness — drop-in developer experience"
readme = "README.md"
license = {text = "Proprietary - All Rights Reserved"}
requires-python = ">=3.14,<3.16"
authors = [
    {name = "AEGIS-COGNITION Team"},
]
keywords = ["ai-agent", "cryptographic-evidence", "wasm-sandbox", "browser-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "blake3>=0.4,<2",
    "fastapi>=0.110,<1",
    "openai>=1.40,<2",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.40,<2"]
all = ["playwright>=1.40,<2", "fastapi>=0.110,<1", "openai>=1.40,<2", "uvicorn[standard]>=0.27,<1"]
dev = ["pyright>=1.1,<2", "pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.3,<1"]

[project.scripts]
aegis = "aegis_cognition.cli:main"
aegis-desktop = "aegis_cognition.desktop_service:main"

[project.urls]
Homepage = "https://aegis-cognition.ai"
Documentation = "https://docs.aegis-cognition.ai"
Repository = "https://github.com/thanhmuefatty07/AEGIS-COGNITION"
Issues = "https://github.com/thanhmuefatty07/AEGIS-COGNITION/issues"

[tool.maturin]
manifest-path = "core/rust/Cargo.toml"
module-name = "aegis_cognition.aegis_nerve"
bindings = "pyo3"
python-source = "."
features = ["python-extension"]
include = [
    { path = "core/python/*.py", format = "wheel" },
    { path = "core/python/aegis/*.py", format = "wheel" },
]

[tool.ruff]
cache-dir = ".local/cache/ruff"
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B", "SIM", "PERF", "RUF", "ASYNC"]

[tool.pytest.ini_options]
cache_dir = ".local/cache/pytest"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pyright]
include = ["aegis_cognition"]
exclude = ["**/__pycache__", "core/python", "tests"]
extraPaths = ["core/python"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportPrivateUsage = false
