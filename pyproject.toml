[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aegis-cognition"
version = "0.1.0"
description = "Cryptographically-verified AI agent harness — drop-in developer experience"
readme = "README.md"
license = {text = "BUSL-1.1"}
requires-python = ">=3.10"
authors = [
    {name = "AEGIS-COGNITION Team"},
]
keywords = ["ai-agent", "cryptographic-evidence", "wasm-sandbox", "browser-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
all = ["aegis-cognition[browser]"]
dev = ["aegis-cognition[all]", "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.3"]

[project.scripts]
aegis = "aegis_cognition.cli:main"

[project.urls]
Homepage = "https://aegis-cognition.ai"
Documentation = "https://docs.aegis-cognition.ai"
Repository = "https://github.com/aegis-cognition/aegis-cognition"
Issues = "https://github.com/aegis-cognition/aegis-cognition/issues"

[tool.setuptools.packages.find]
include = ["aegis_cognition*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]