[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "aegis-cognition"
version = "0.1.0"
description = "Cryptographically-verified AI agent harness — drop-in developer experience"
readme = "README.md"
license = {text = "BUSL-1.1"}
requires-python = ">=3.14,<3.16"
authors = [
    {name = "AEGIS-COGNITION Team"},
]
keywords = ["ai-agent", "cryptographic-evidence", "wasm-sandbox", "browser-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "blake3>=0.4,<2",
    "fastapi>=0.110,<1",
    "openai>=1.40,<2",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.40,<2"]
all = ["playwright>=1.40,<2", "fastapi>=0.110,<1", "openai>=1.40,<2", "uvicorn[standard]>=0.27,<1"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.3,<1"]

[project.scripts]
aegis = "aegis_cognition.cli:main"

[project.urls]
Homepage = "https://aegis-cognition.ai"
Documentation = "https://docs.aegis-cognition.ai"
Repository = "https://github.com/aegis-cognition/aegis-cognition"
Issues = "https://github.com/aegis-cognition/aegis-cognition/issues"

[tool.maturin]
manifest-path = "core/rust/Cargo.toml"
module-name = "aegis_cognition.aegis_nerve"
bindings = "pyo3"
python-source = "."
features = ["python-extension"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
