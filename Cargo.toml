[workspace]
members = [
    "core/rust",
    "aegis-plugins/aegis-search-sdk",
    "aegis-plugins/aegis-browser",
    "aegis-plugins/aegis-sandbox",
    "aegis-plugins/aegis-skills",
    "aegis-plugins/aegis-evidence",
    "aegis-plugins/aegis-bench",
    "pocs/semantic_cache_poc",
    "pocs/tool_batching_poc",
    "pocs/code_orchestration_poc",
]
default-members = [
    "core/rust",
    "aegis-plugins/aegis-search-sdk",
    "aegis-plugins/aegis-browser",
    "aegis-plugins/aegis-sandbox",
    "aegis-plugins/aegis-skills",
    "aegis-plugins/aegis-evidence",
    "aegis-plugins/aegis-bench",
]
resolver = "3"

[workspace.package]
rust-version = "1.98"

[profile.test]
debug = 0

[profile.dev]
debug = 0
