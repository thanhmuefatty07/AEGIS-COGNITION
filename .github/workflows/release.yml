name: Release evidence

"on":
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  UV_VERSION: 0.12.3

jobs:
  build-and-attest:
    name: Build, verify, and attest release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify checkout provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"
      - name: Install locked build tooling
        run: python -m pip install --upgrade pip "uv==${{ env.UV_VERSION }}"
      - name: Resolve locked environment
        run: uv sync --locked --no-install-project --extra all --extra dev
      - name: Run release-bound test suites
        run: |
          cargo test --workspace --no-default-features
          uv run --no-project pytest tests core/python/tests.py -q
      - name: Build versioned wheel
        run: uv build --wheel --out-dir artifacts/wheels
      - name: Install and import the exact release wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find artifacts/wheels -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          mkdir -p artifacts/release-input/wheels
          cp "$wheel" artifacts/release-input/wheels/
          python scripts/release_install_smoke.py --wheel "$wheel" --output artifacts/release-input/install-smoke.json
      - name: Verify release payload and generate SBOM
        run: |
          python -m py_compile scripts/release_evidence.py
          uv run --no-project ruff check scripts/release_evidence.py
          cargo metadata --locked --format-version 1 > artifacts/release-input/cargo-metadata.json
          git rev-parse HEAD > artifacts/release-input/checkout-sha.txt
          python scripts/release_evidence.py --artifacts artifacts/release-input --output artifacts/release
      - name: Bind current evidence manifest to release artifacts
        run: cp artifacts/evidence/current.json artifacts/release/current-evidence.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        id: build-provenance
        continue-on-error: true
        with:
          subject-path: artifacts/wheels/*.whl
      - name: Record attestation outcome
        if: always()
        env:
          ATTESTATION_OUTCOME: ${{ steps.build-provenance.outcome }}
        run: python scripts/attestation_status.py --output artifacts/release/attestation-status.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: aegis-release-evidence-${{ github.sha }}
          path: |
            artifacts/release
            artifacts/release-input
