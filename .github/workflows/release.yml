name: Release evidence

"on":
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: aegis-release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: 0.12.9

jobs:
  build-and-attest:
    name: Build, verify, and attest release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"
      - name: Verify checkout provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/document_consistency_gate.py
          python scripts/aese_inventory.py --check
          python scripts/aese_claim_graph.py --check
          python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
      - name: Install locked build tooling
        run: python -m pip install --upgrade pip "uv==${{ env.UV_VERSION }}"
      - name: Resolve locked environment
        run: uv sync --locked --no-install-project --extra all --extra dev
      - name: Run release-bound Rust suite
        run: python scripts/suite_evidence.py --name release-rust-workspace --output artifacts/suites/release-rust-workspace.json --status-output artifacts/suite-status/release-rust-workspace.json --owner-id ci-release-rust --gate-id release-rust-workspace --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 1800 -- cargo test --workspace --no-default-features
      - name: Run release-bound Python suite
        run: python scripts/suite_evidence.py --name release-python-cross-language --output artifacts/suites/release-python-cross-language.json --status-output artifacts/suite-status/release-python-cross-language.json --owner-id ci-release-python --gate-id release-python-cross-language --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 900 -- uv run --no-project pytest tests core/python/tests.py -q -W error::DeprecationWarning
      - name: Build versioned wheel
        run: uv build --wheel --out-dir artifacts/wheels
      - name: Install and import the exact release wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find artifacts/wheels -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          mkdir -p artifacts/release-input/wheels artifacts/private/release-smoke
          cp "$wheel" artifacts/release-input/wheels/
          python scripts/release_install_smoke.py --wheel "$wheel" --output artifacts/private/release-smoke/install-smoke.json
          python scripts/release_controller_action_smoke.py --wheel "$wheel" --output artifacts/private/release-smoke/controller-action-smoke.json
      - name: Verify release payload and generate SBOM
        run: |
          python -m py_compile scripts/release_evidence.py
          uv run --no-project ruff check scripts/release_evidence.py
          mkdir -p artifacts/private
          cargo metadata --locked --format-version 1 > artifacts/private/cargo-metadata.json
          git rev-parse HEAD > artifacts/private/checkout-sha.txt
          python scripts/release_evidence.py --artifacts artifacts/release-input --output artifacts/release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        id: build-provenance
        continue-on-error: true
        with:
          subject-path: artifacts/wheels/*.whl
      - name: Record attestation outcome
        if: always()
        env:
          ATTESTATION_OUTCOME: ${{ steps.build-provenance.outcome }}
        run: python scripts/attestation_status.py --output artifacts/release/attestation-status.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: aegis-release-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/release
            artifacts/release-input/wheels/*.whl
            artifacts/suite-status/*.json
