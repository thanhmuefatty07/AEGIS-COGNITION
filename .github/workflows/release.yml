name: Release evidence

"on":
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  UV_VERSION: 0.12.3

jobs:
  build-and-attest:
    name: Build, verify, and attest release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify checkout provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"
      - name: Install locked build tooling
        run: python -m pip install --upgrade pip "uv==${{ env.UV_VERSION }}"
      - name: Resolve locked environment
        run: uv sync --locked --extra all --extra dev
      - name: Build versioned wheel
        run: uv build --wheel --out-dir artifacts/wheels
      - name: Verify release payload and generate SBOM
        run: |
          python -m py_compile scripts/release_evidence.py
          uv run --locked --extra all --extra dev ruff check scripts/release_evidence.py
          python scripts/release_evidence.py --artifacts artifacts/wheels --output artifacts/release
      - name: Rust metadata evidence
        run: cargo metadata --locked --format-version 1 > artifacts/release/cargo-metadata.json
      - name: Bind current evidence manifest to release artifacts
        run: cp artifacts/evidence/current.json artifacts/release/current-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-release-evidence-${{ github.sha }}
          path: artifacts/release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/wheels/*.whl
