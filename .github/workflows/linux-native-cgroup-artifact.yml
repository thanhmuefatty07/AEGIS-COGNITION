name: Linux native cgroup adapter artifact

"on":
  workflow_dispatch:
  push:
    branches:
      - codex/linux-native-cgroup-probe

permissions:
  contents: read

jobs:
  build:
    name: Build native Linux cgroup probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned toolchain action
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Build ignored native probe test
        run: cargo test --manifest-path core/rust/Cargo.toml --test linux_cgroup_native_probe --no-default-features --no-run --locked
      - name: Retain executable and digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          probe="$(find target/debug/deps -maxdepth 1 -type f -name 'linux_cgroup_native_probe-*' -perm -u+x | head -n 1)"
          test -n "$probe"
          cp "$probe" artifacts/linux-cgroup-native-probe
          sha256sum artifacts/linux-cgroup-native-probe | tee artifacts/linux-cgroup-native-probe.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-native-cgroup-probe-${{ github.sha }}
          path: |
            artifacts/linux-cgroup-native-probe
            artifacts/linux-cgroup-native-probe.sha256
