name: Deep evidence

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

env:
  UV_VERSION: 0.12.3

jobs:
  security-and-replay:
    name: Security, replay, and dependency evidence
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Format and strict lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Full workspace tests
        run: cargo test --workspace --no-default-features
      - name: Install deep Rust quality tools
        run: |
          cargo install cargo-nextest --version 0.9.143 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Full workspace nextest
        run: python scripts/suite_evidence.py --name rust-full-workspace --output artifacts/suites/rust-full-workspace.json -- cargo nextest run --workspace --no-default-features
      - name: Cargo deny policy
        run: cargo deny check advisories bans licenses sources
      - name: Prepare coverage output directory
        run: mkdir -p artifacts
      - name: LLVM coverage evidence
        run: cargo llvm-cov --workspace --no-default-features --lcov --output-path artifacts/rust-coverage.lcov
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.0 --locked
      - name: Advisory audit
        run: cargo audit
      - name: Repository gates
        run: |
          python scripts/architecture_fitness.py
          python scripts/secret_scan.py
          python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
          python scripts/dependency_audit_gate.py
          python scripts/wasmtime_migration_gate.py
      - name: Replay and resource evidence
        run: |
          python scripts/resource_policy_benchmark.py --profile H1 --iterations 200 --output artifacts/resource-policy-local-only.json
          python scripts/hardware_profile_report.py --output artifacts/hardware-profile-local-only.json
          python scripts/platform_enforcement_probe.py --output artifacts/platform-enforcement-probe.json
          cargo bench --manifest-path core/rust/Cargo.toml --bench resource_runtime --no-default-features -- --sample-size 10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-evidence-${{ github.sha }}
          path: |
            artifacts/resource-policy-local-only.json
            artifacts/hardware-profile-local-only.json
            artifacts/platform-enforcement-probe.json
            artifacts/evidence/current.json
            artifacts/rust-coverage.lcov
            artifacts/suites
            target/criterion

  fuzz-resource-contract:
    name: Trust-boundary fuzz campaign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz parser, protocol, runtime, and archive targets
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          set -euo pipefail
          mkdir -p artifacts/fuzz
          for target in resource_contract protocol_frame runtime_ffi_contract archive_prefix; do
            cargo fuzz run "$target" -- -max_total_time=900 -print_final_stats=1 | tee "artifacts/fuzz/${target}.log"
          done
          git rev-parse HEAD > artifacts/fuzz/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-campaign-${{ github.sha }}
          path: |
            artifacts/fuzz
            fuzz/corpus
            fuzz/artifacts

  miri-and-sanitizers:
    name: Miri and sanitizer probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
          components: miri, rust-src
      - name: Miri selected contract probe
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --manifest-path core/rust/Cargo.toml --lib --no-default-features resource::tests
      - name: Address sanitizer selected probe
        if: always()
        env:
          RUSTFLAGS: -Z sanitizer=address
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --manifest-path core/rust/Cargo.toml --lib --no-default-features resource::tests
