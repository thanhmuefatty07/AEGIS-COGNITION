name: Deep evidence

"on":
  workflow_dispatch:
    inputs:
      target:
        description: Choose the full evidence run or one isolated WP12 native gate.
        required: true
        type: choice
        default: wp12-windows-native-process
        options:
          - all
          - wp12-windows-native-process
          - wp12-linux-cgroup-enforcement
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

concurrency:
  group: aegis-deep-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: 0.12.9

jobs:
  platform-enforcement-matrix:
    name: Native platform evidence (${{ matrix.platform-id }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform-id: ubuntu-latest
            probe: linux_cgroup_live_probe.py
          - os: windows-latest
            platform-id: windows-latest
            probe: windows_job_object_live_probe.py
          - os: macos-14
            platform-id: macos-14
            probe: macos_capability_probe.py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Run native platform probe
        shell: bash
        env:
          PROBE: ${{ matrix.probe }}
          PLATFORM_ID: ${{ matrix.platform-id }}
          REQUIRE_LIVE: ${{ matrix.platform-id == 'ubuntu-latest' }}
        run: |
          mkdir -p artifacts/platform
          REQUIRE_LIVE_ARGS=()
          if [[ "$REQUIRE_LIVE" == "true" ]]; then
            sudo mkdir -p /sys/fs/cgroup/user.slice/aegis-caller
            for ctrl in cpu memory pids; do
              echo "+$ctrl" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null || true
              echo "+$ctrl" | sudo tee /sys/fs/cgroup/user.slice/cgroup.subtree_control >/dev/null || true
            done
            sudo chown "$(id -u):$(id -g)" /sys/fs/cgroup/user.slice /sys/fs/cgroup/user.slice/cgroup.procs /sys/fs/cgroup/user.slice/cgroup.subtree_control /sys/fs/cgroup/user.slice/cgroup.kill
            sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/user.slice/aegis-caller
            echo $$ | sudo tee /sys/fs/cgroup/user.slice/aegis-caller/cgroup.procs >/dev/null
            REQUIRE_LIVE_ARGS+=(--require-live --cgroup-root /sys/fs/cgroup/user.slice)
          fi
          python "scripts/${PROBE}" "${REQUIRE_LIVE_ARGS[@]}" --output "artifacts/platform/${PLATFORM_ID}.json" > "artifacts/platform/${PLATFORM_ID}.console.log" 2>&1
      - name: Bind probe to commit and runner metadata
        if: always()
        shell: bash
        env:
          PLATFORM_ID: ${{ matrix.platform-id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import platform
          from datetime import UTC, datetime
          from pathlib import Path

          platform_id = os.environ["PLATFORM_ID"]
          report_path = Path("artifacts/platform") / f"{platform_id}.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          verification = {
              "schema": "aegis-platform-verification-v1",
              "status": report.get("status"),
              "evidence_binding": {
                  "commit_sha": os.environ["GITHUB_SHA"],
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "runner_label": platform_id,
                  "runner_os": os.environ["RUNNER_OS"],
                  "runner_arch": os.environ["RUNNER_ARCH"],
                  "python_version": platform.python_version(),
                  "captured_at_utc": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              },
          }
          verification_path = Path("artifacts/platform") / f"{platform_id}-verification.json"
          verification_path.write_text(json.dumps(verification, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"platform": platform_id, "status": verification["status"]}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: platform-enforcement-${{ matrix.platform-id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/platform/${{ matrix.platform-id }}-verification.json
          if-no-files-found: error

  platform-enforcement-evidence-completeness:
    name: Platform evidence completeness
    runs-on: ubuntu-latest
    needs: platform-enforcement-matrix
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.target == 'all') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: platform-enforcement-*-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/platform
          merge-multiple: true
      - name: Validate complete, commit-bound platform evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          expected = {"ubuntu-latest", "windows-latest", "macos-14"}
          reports = {}
          for path in Path("artifacts/platform").glob("*.json"):
              payload = json.loads(path.read_text(encoding="utf-8"))
              binding = payload.get("evidence_binding", {})
              runner_label = binding.get("runner_label")
              if runner_label:
                  reports[runner_label] = payload
          missing = sorted(expected - reports.keys())
          mismatched = sorted(
              label for label, payload in reports.items()
              if payload.get("evidence_binding", {}).get("commit_sha") != os.environ["GITHUB_SHA"]
          )
          summary = {
              "expected": sorted(expected),
              "observed": sorted(reports),
              "statuses": {label: reports[label].get("status") for label in sorted(reports)},
              "missing": missing,
              "commit_mismatch": mismatched,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          if missing or mismatched:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: platform-enforcement-completeness-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/platform
          if-no-files-found: error

  wp12-windows-native-process:
    name: WP12 Windows native process lifecycle
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'wp12-windows-native-process' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Run scoped WP12 Windows lifecycle test
        env:
          PYO3_PYTHON: python
        run: python scripts/suite_evidence.py --name wp12-windows-native-process --output artifacts/suites/wp12-windows-native-process.json --status-output artifacts/suite-status/wp12-windows-native-process.json --owner-id wp12-windows-native-process --gate-id wp12-windows-native-process --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 1800 -- cargo test --locked --manifest-path core/rust/Cargo.toml --lib --no-default-features execution::tests::native_process_lane_
      - name: Run WP12 runtime deadline regressions
        env:
          PYO3_PYTHON: python
        run: >-
          python scripts/suite_evidence.py --name wp12-runtime-deadline --output artifacts/suites/wp12-runtime-deadline.json --status-output artifacts/suite-status/wp12-runtime-deadline.json --owner-id wp12-runtime-deadline --gate-id wp12-runtime-deadline --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}-runtime-deadline" --timeout-seconds 1800 -- cargo test --locked --manifest-path core/rust/Cargo.toml --lib --no-default-features runtime::tests::
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wp12-windows-native-process-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/suite-status/wp12-windows-native-process.json
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wp12-runtime-deadline-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/suite-status/wp12-runtime-deadline.json
          if-no-files-found: error
          retention-days: 3

  wp12-linux-cgroup-enforcement:
    name: WP12 Linux cgroup-v2 enforcement
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'wp12-linux-cgroup-enforcement' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Delegate writable cgroup-v2 subtree for unprivileged probe runner
        shell: bash
        run: |
          sudo mkdir -p /sys/fs/cgroup/user.slice/aegis-caller
          for ctrl in cpu memory pids; do
            echo "+$ctrl" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null || true
            echo "+$ctrl" | sudo tee /sys/fs/cgroup/user.slice/cgroup.subtree_control >/dev/null || true
          done
          sudo chown "$(id -u):$(id -g)" /sys/fs/cgroup/user.slice /sys/fs/cgroup/user.slice/cgroup.procs /sys/fs/cgroup/user.slice/cgroup.subtree_control /sys/fs/cgroup/user.slice/cgroup.kill
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/user.slice/aegis-caller
      - name: Run strict Linux Python cgroup probe
        id: linux-probe
        continue-on-error: true
        shell: bash
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/user.slice/aegis-caller/cgroup.procs >/dev/null
          mkdir -p artifacts/private
          python scripts/linux_cgroup_live_probe.py --require-live --cgroup-root /sys/fs/cgroup/user.slice --output artifacts/private/linux-cgroup-python.json > artifacts/private/linux-cgroup-python.console.log 2>&1
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Run ignored native Linux cgroup probe
        id: native-linux-probe
        continue-on-error: true
        env:
          AEGIS_LINUX_CGROUP_ROOT: /sys/fs/cgroup/user.slice
          CARGO_BUILD_JOBS: 1
          PYO3_PYTHON: python
          RUSTFLAGS: -C debuginfo=0
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/user.slice/aegis-caller/cgroup.procs >/dev/null
          python scripts/suite_evidence.py --name wp12-linux-cgroup-native --output artifacts/suites/wp12-linux-cgroup-rust.json --owner-id wp12-linux-cgroup-enforcement --gate-id wp12-linux-cgroup-enforcement --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --platform-id ubuntu-latest --timeout-seconds 1800 -- cargo test --locked --manifest-path core/rust/Cargo.toml --no-default-features --test linux_cgroup_native_probe linux_cgroup_native_adapter_live_controls -- --ignored --exact
      - name: Capture native Linux cgroup failure diagnostic
        if: ${{ always() && steps.native-linux-probe.outcome != 'success' }}
        continue-on-error: true
        env:
          AEGIS_LINUX_CGROUP_ROOT: /sys/fs/cgroup/user.slice
          RUST_BACKTRACE: "1"
        shell: bash
        run: |
          set +e
          echo $$ | sudo tee /sys/fs/cgroup/user.slice/aegis-caller/cgroup.procs >/dev/null
          test_binary=$(find target/debug/deps -maxdepth 1 -type f -name 'linux_cgroup_native_probe-*' -perm -111 | sort | head -n 1)
          if [[ -z "$test_binary" ]]; then
            echo "native Linux cgroup test executable was not produced"
            exit 0
          fi
          echo "running diagnostic binary: $test_binary"
          "$test_binary" linux_cgroup_native_adapter_live_controls --ignored --exact --nocapture
      - name: Bind Linux cgroup outcomes to this run
        if: always()
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          PYTHON_PROBE_OUTCOME: ${{ steps.linux-probe.outcome }}
          RUST_PROBE_OUTCOME: ${{ steps.native-linux-probe.outcome }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import platform
          from datetime import UTC, datetime
          from pathlib import Path

          def read_report(path: str) -> dict:
              try:
                  value = json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return {}
              return value if isinstance(value, dict) else {}

          python_report = read_report("artifacts/private/linux-cgroup-python.json")
          rust_report = read_report("artifacts/suites/wp12-linux-cgroup-rust.json")
          checks = python_report.get("checks", {})
          if not isinstance(checks, dict):
              checks = {}
          verified_checks = sorted(name for name, value in checks.items() if value is True)
          unverified_checks = sorted(name for name, value in checks.items() if value is not True)
          python_passed = (
              os.environ.get("PYTHON_PROBE_OUTCOME") == "success"
              and python_report.get("status") == "LIVE VERIFIED"
              and bool(checks)
              and not unverified_checks
          )
          rust_passed = (
              os.environ.get("RUST_PROBE_OUTCOME") == "success"
              and rust_report.get("status") == "PROVEN"
              and rust_report.get("exit_code") == 0
              and rust_report.get("passed") == 1
              and rust_report.get("failed") == 0
              and rust_report.get("skipped") == 0
              and rust_report.get("timed_out") is False
          )
          summary = {
              "schema": "aegis-wp12-linux-cgroup-verification-v1",
              "status": "LIVE VERIFIED" if python_passed and rust_passed else "NOT VERIFIED",
              "evidence_binding": {
                  "commit_sha": os.environ["GITHUB_SHA"],
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "runner_label": "ubuntu-latest",
                  "runner_os": os.environ["RUNNER_OS"],
                  "runner_arch": os.environ["RUNNER_ARCH"],
                  "python_version": platform.python_version(),
                  "rust_toolchain": rust_report.get("toolchain"),
                  "captured_at_utc": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              },
              "python_probe": {
                  "status": python_report.get("status", "NOT VERIFIED"),
                  "outcome": os.environ.get("PYTHON_PROBE_OUTCOME", "missing"),
                  "verified_checks": verified_checks,
                  "unverified_checks": unverified_checks,
              },
              "rust_probe": {
                  "status": rust_report.get("status", "NOT VERIFIED"),
                  "outcome": os.environ.get("RUST_PROBE_OUTCOME", "missing"),
                  "exit_code": rust_report.get("exit_code"),
                  "passed": rust_report.get("passed", 0),
                  "failed": rust_report.get("failed", 0),
                  "skipped": rust_report.get("skipped", 0),
                  "timed_out": rust_report.get("timed_out"),
              },
              "independent_verification": "NOT VERIFIED",
          }
          output = Path("artifacts/wp12-linux-cgroup-verification.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"status": summary["status"], "python": summary["python_probe"]["status"], "rust": summary["rust_probe"]["status"]}, sort_keys=True))
          PY
      - name: Upload sanitized WP12 Linux evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp12-linux-cgroup-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/wp12-linux-cgroup-verification.json
          if-no-files-found: error
          retention-days: 3
      - name: Require live Linux cgroup evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("artifacts/wp12-linux-cgroup-verification.json").read_text(encoding="utf-8"))
          print(json.dumps({"status": summary.get("status")}, sort_keys=True))
          if summary.get("status") != "LIVE VERIFIED":
              raise SystemExit("WP12 Linux cgroup evidence is not fully verified")
          PY

  security-and-replay:
    name: Security, replay, and dependency evidence
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - name: Document consistency
        run: python scripts/document_consistency_gate.py
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Format and strict lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Full workspace doctests
        run: python scripts/suite_evidence.py --name rust-workspace-doctests --output artifacts/suites/rust-workspace-doctests.json --status-output artifacts/suite-status/rust-workspace-doctests.json --owner-id ci-deep-rust --gate-id rust-workspace-doctests --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 900 -- cargo test --workspace --no-default-features --doc
      - name: Install deep Rust quality tools
        run: |
          cargo install cargo-nextest --version 0.9.143 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Full workspace nextest
        run: python scripts/suite_evidence.py --name rust-full-workspace --output artifacts/suites/rust-full-workspace.json --status-output artifacts/suite-status/rust-full-workspace.json --owner-id ci-deep-rust --gate-id rust-full-workspace --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 1800 -- cargo nextest run --workspace --no-default-features
      - name: Cargo deny policy
        run: cargo deny check advisories bans licenses sources
      - name: Prepare coverage output directory
        run: mkdir -p artifacts
      - name: LLVM coverage evidence
        run: cargo llvm-cov --workspace --no-default-features --lcov --output-path artifacts/rust-coverage.lcov
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.0 --locked
      - name: Advisory audit
        run: |
          mapfile -t IGNORE_FLAGS < <(python -B -c 'import pathlib, sys, tomllib; data = tomllib.loads(pathlib.Path("deny.toml").read_text(encoding="utf-8")); items = data.get("advisories", {}).get("ignore", []); sys.stdout.buffer.write("".join(f"--ignore={item}\n" for item in items).encode("utf-8"))')
          cargo audit "${IGNORE_FLAGS[@]}"
      - name: Repository gates
        run: |
          python scripts/architecture_fitness.py
          python scripts/secret_scan.py
          python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
          python scripts/dependency_audit_gate.py
          python scripts/wasmtime_migration_gate.py
      - name: Replay and resource evidence
        run: |
          mkdir -p artifacts
          python scripts/resource_policy_benchmark.py --profile H1 --iterations 200 --output artifacts/resource-policy-local-only.json > artifacts/resource-policy-benchmark.console.log 2>&1
          python scripts/hardware_profile_report.py --output artifacts/hardware-profile-local-only.json > artifacts/hardware-profile.console.log 2>&1
          python scripts/platform_enforcement_probe.py --output artifacts/platform-enforcement-probe.json > artifacts/platform-enforcement-probe.console.log 2>&1
          python scripts/linux_cgroup_live_probe.py --output artifacts/linux-cgroup-live-probe.json > artifacts/linux-cgroup-live-probe.console.log 2>&1
          python scripts/communication_payload_benchmark.py --iterations 5 --output artifacts/communication-payload-benchmark.json > artifacts/communication-payload-benchmark.console.log 2>&1
      - name: Upload sanitized verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-verification-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/suite-status

  rust-resource-benchmark:
    name: Rust resource benchmark evidence
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Cache Rust dependencies and build outputs without Criterion reports
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Raw Criterion measurements under target/criterion must stay out of cache.
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/debug/
            target/release/
          key: ${{ runner.os }}-deep-rust-build-${{ hashFiles('**/Cargo.lock') }}
      - name: Run resource benchmark suite without publishing measurements
        run: |
          mkdir -p artifacts
          if cargo bench --manifest-path core/rust/Cargo.toml --bench resource_runtime --no-default-features -- --sample-size 10 --warm-up-time 1 --measurement-time 1 > artifacts/resource-benchmark.console.log 2>&1; then
            echo "Resource benchmark completed; raw measurements are not published."
          else
            echo "::error::Resource benchmark failed; detailed output remains unpublished."
            exit 1
          fi

  hardware-buffer-benchmark:
    name: Hardware buffer benchmark matrix
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    uses: ./.github/workflows/mmap-stream-buffer-benchmark.yml

  fuzz-resource-contract:
    name: Trust-boundary fuzz campaign
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz parser, protocol, runtime, and archive targets
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          set -euo pipefail
          mkdir -p artifacts/fuzz
          for target in resource_contract protocol_frame runtime_ffi_contract archive_prefix; do
            stdout_log="artifacts/fuzz/${target}.stdout.log"
            stderr_log="artifacts/fuzz/${target}.stderr.log"
            combined_log="artifacts/fuzz/${target}.log"
            stats_log="artifacts/fuzz/${target}.stats.log"
            status_log="artifacts/fuzz/${target}.status"

            set +e
            cargo fuzz run "$target" -- -max_total_time=${{ github.event_name == 'schedule' && 900 || 60 }} -print_final_stats=1 \
              > "$stdout_log" 2> "$stderr_log"
            status=$?
            set -e

            cat "$stdout_log" "$stderr_log" > "$combined_log"
            printf '%s\n' "$status" > "$status_log"

            test -s "$combined_log"
            if [ ! -s "$stdout_log" ] && [ ! -s "$stderr_log" ]; then
              echo "cargo fuzz target ${target} produced no stdout or stderr" >&2
              exit 1
            fi
            if [ "$status" -ne 0 ]; then
              echo "cargo fuzz target ${target} failed with status ${status}" >&2
              exit "$status"
            fi
            grep -E '^stat::number_of_executed_units:' "$combined_log" > "$stats_log"
            test -s "$stats_log"
          done
          git rev-parse HEAD > artifacts/fuzz/commit.txt
      - name: Sanitize fuzz logs and isolate crash reproducers
        if: always()
        run: |
          python scripts/sanitize_fuzz_logs.py --log-dir artifacts/fuzz --isolate-crashes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-campaign-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/fuzz/*.status
            artifacts/fuzz/commit.txt

  miri-and-sanitizers:
    name: Miri and sanitizer probes
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
          components: miri, rust-src
      - name: Miri selected contract probe
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --manifest-path core/rust/Cargo.toml --lib --no-default-features resource::tests
      - name: Address sanitizer selected probe
        if: always()
        env:
          RUSTFLAGS: -Z sanitizer=address
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --manifest-path core/rust/Cargo.toml --lib --no-default-features resource::tests
