name: Deep evidence

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

env:
  UV_VERSION: 0.12.3

jobs:
  security-and-replay:
    name: Security, replay, and dependency evidence
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Format and strict lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Full workspace tests
        run: cargo test --workspace --no-default-features
      - name: Install deep Rust quality tools
        run: |
          cargo install cargo-nextest --version 0.9.143 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Full workspace nextest
        run: cargo nextest run --workspace --no-default-features
      - name: Cargo deny policy
        run: cargo deny check advisories bans licenses sources
      - name: LLVM coverage evidence
        run: cargo llvm-cov --workspace --no-default-features --lcov --output-path artifacts/rust-coverage.lcov
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.0 --locked
      - name: Advisory audit
        run: cargo audit
      - name: Repository gates
        run: |
          python scripts/architecture_fitness.py
          python scripts/secret_scan.py
          python scripts/dependency_audit_gate.py
          python scripts/wasmtime_migration_gate.py
      - name: Replay and resource evidence
        run: |
          python scripts/resource_policy_benchmark.py --profile H1 --iterations 200 --output artifacts/resource-policy-local-only.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-evidence-${{ github.sha }}
          path: |
            artifacts/resource-policy-local-only.json
            artifacts/rust-coverage.lcov

  fuzz-resource-contract:
    name: Resource contract fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz resource contract parser
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo fuzz run resource_contract -- -max_total_time=60 -runs=10000

  miri-and-sanitizers:
    name: Miri and sanitizer probes
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
          components: miri
      - name: Miri selected contract probe
        run: cargo miri test --manifest-path core/rust/Cargo.toml --lib --no-default-features resource::tests
      - name: Address sanitizer selected probe
        env:
          RUSTFLAGS: -Z sanitizer=address
        run: cargo +nightly test --manifest-path core/rust/Cargo.toml --lib --no-default-features resource::tests
