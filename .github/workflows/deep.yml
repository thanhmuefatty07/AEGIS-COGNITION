name: Deep evidence

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

concurrency:
  group: aegis-deep-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: 0.12.9

jobs:
  platform-enforcement-matrix:
    name: Native platform evidence (${{ matrix.platform-id }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform-id: ubuntu-latest
            probe: linux_cgroup_live_probe.py
          - os: windows-latest
            platform-id: windows-latest
            probe: windows_job_object_live_probe.py
          - os: macos-14
            platform-id: macos-14
            probe: macos_capability_probe.py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Run native platform probe
        shell: bash
        env:
          PROBE: ${{ matrix.probe }}
          PLATFORM_ID: ${{ matrix.platform-id }}
        run: |
          mkdir -p artifacts/platform
          python "scripts/${PROBE}" --output "artifacts/platform/${PLATFORM_ID}.json"
      - name: Bind probe to commit and runner metadata
        shell: bash
        env:
          PLATFORM_ID: ${{ matrix.platform-id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import platform
          import shutil
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          platform_id = os.environ["PLATFORM_ID"]
          report_path = Path("artifacts/platform") / f"{platform_id}.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if shutil.which("rustc"):
              rust_version = subprocess.run(
                  ["rustc", "--version"], capture_output=True, text=True, check=False
              )
              rust_version_text = (rust_version.stdout or rust_version.stderr).strip()
          else:
              rust_version_text = "unavailable on runner"
          report["evidence_binding"] = {
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_label": platform_id,
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "runner_name": os.environ["RUNNER_NAME"],
              "python_version": platform.python_version(),
              "rust_version": rust_version_text,
              "captured_at_utc": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
          }
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"platform": platform_id, "status": report.get("status")}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: platform-enforcement-${{ matrix.platform-id }}-${{ github.sha }}
          path: artifacts/platform/${{ matrix.platform-id }}.json
          if-no-files-found: error

  platform-enforcement-evidence-completeness:
    name: Platform evidence completeness
    runs-on: ubuntu-latest
    needs: platform-enforcement-matrix
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: platform-enforcement-*-${{ github.sha }}
          path: artifacts/platform
          merge-multiple: true
      - name: Validate complete, commit-bound platform evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          expected = {"ubuntu-latest", "windows-latest", "macos-14"}
          reports = {}
          for path in Path("artifacts/platform").glob("*.json"):
              payload = json.loads(path.read_text(encoding="utf-8"))
              binding = payload.get("evidence_binding", {})
              runner_label = binding.get("runner_label")
              if runner_label:
                  reports[runner_label] = payload
          missing = sorted(expected - reports.keys())
          mismatched = sorted(
              label for label, payload in reports.items()
              if payload.get("evidence_binding", {}).get("commit_sha") != os.environ["GITHUB_SHA"]
          )
          summary = {
              "expected": sorted(expected),
              "observed": sorted(reports),
              "statuses": {label: reports[label].get("status") for label in sorted(reports)},
              "missing": missing,
              "commit_mismatch": mismatched,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          if missing or mismatched:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: platform-enforcement-completeness-${{ github.sha }}
          path: artifacts/platform
          if-no-files-found: error

  security-and-replay:
    name: Security, replay, and dependency evidence
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - name: Document consistency
        run: python scripts/document_consistency_gate.py
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Format and strict lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Full workspace doctests
        run: python scripts/suite_evidence.py --name rust-workspace-doctests --output artifacts/suites/rust-workspace-doctests.json --owner-id ci-deep-rust --gate-id rust-workspace-doctests --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 900 -- cargo test --workspace --no-default-features --doc
      - name: Install deep Rust quality tools
        run: |
          cargo install cargo-nextest --version 0.9.143 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Full workspace nextest
        run: python scripts/suite_evidence.py --name rust-full-workspace --output artifacts/suites/rust-full-workspace.json --owner-id ci-deep-rust --gate-id rust-full-workspace --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 1800 -- cargo nextest run --workspace --no-default-features
      - name: Cargo deny policy
        run: cargo deny check advisories bans licenses sources
      - name: Prepare coverage output directory
        run: mkdir -p artifacts
      - name: LLVM coverage evidence
        run: cargo llvm-cov --workspace --no-default-features --lcov --output-path artifacts/rust-coverage.lcov
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.0 --locked
      - name: Advisory audit
        run: cargo audit
      - name: Repository gates
        run: |
          python scripts/architecture_fitness.py
          python scripts/secret_scan.py
          python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
          python scripts/dependency_audit_gate.py
          python scripts/wasmtime_migration_gate.py
      - name: Replay and resource evidence
        run: |
          python scripts/resource_policy_benchmark.py --profile H1 --iterations 200 --output artifacts/resource-policy-local-only.json
          python scripts/hardware_profile_report.py --output artifacts/hardware-profile-local-only.json
          python scripts/platform_enforcement_probe.py --output artifacts/platform-enforcement-probe.json
          python scripts/linux_cgroup_live_probe.py --output artifacts/linux-cgroup-live-probe.json
          python scripts/communication_payload_benchmark.py --iterations 5 --output artifacts/communication-payload-benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-evidence-${{ github.sha }}
          path: |
            artifacts/resource-policy-local-only.json
            artifacts/hardware-profile-local-only.json
            artifacts/platform-enforcement-probe.json
            artifacts/linux-cgroup-live-probe.json
            artifacts/communication-payload-benchmark.json
            artifacts/evidence/current.json
            artifacts/rust-coverage.lcov
            artifacts/suites

  rust-resource-benchmark:
    name: Rust resource benchmark evidence
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-deep-resource-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Run resource benchmark suite
        run: cargo bench --manifest-path core/rust/Cargo.toml --bench resource_runtime --no-default-features -- --sample-size 10 --warm-up-time 1 --measurement-time 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resource-benchmark-${{ github.sha }}
          path: target/criterion
          if-no-files-found: warn

  fuzz-resource-contract:
    name: Trust-boundary fuzz campaign
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz parser, protocol, runtime, and archive targets
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          set -euo pipefail
          mkdir -p artifacts/fuzz
          for target in resource_contract protocol_frame runtime_ffi_contract archive_prefix; do
            stdout_log="artifacts/fuzz/${target}.stdout.log"
            stderr_log="artifacts/fuzz/${target}.stderr.log"
            combined_log="artifacts/fuzz/${target}.log"
            stats_log="artifacts/fuzz/${target}.stats.log"
            status_log="artifacts/fuzz/${target}.status"

            set +e
            cargo fuzz run "$target" -- -max_total_time=900 -print_final_stats=1 \
              > "$stdout_log" 2> "$stderr_log"
            status=$?
            set -e

            cat "$stdout_log" "$stderr_log" | tee "$combined_log"
            printf '%s\n' "$status" > "$status_log"

            test -s "$combined_log"
            if [ ! -s "$stdout_log" ] && [ ! -s "$stderr_log" ]; then
              echo "cargo fuzz target ${target} produced no stdout or stderr" >&2
              exit 1
            fi
            if [ "$status" -ne 0 ]; then
              echo "cargo fuzz target ${target} failed with status ${status}" >&2
              exit "$status"
            fi
            grep -E '^stat::number_of_executed_units:' "$combined_log" > "$stats_log"
            test -s "$stats_log"
          done
          git rev-parse HEAD > artifacts/fuzz/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-campaign-${{ github.sha }}
          path: |
            artifacts/fuzz
            fuzz/corpus
            fuzz/artifacts

  miri-and-sanitizers:
    name: Miri and sanitizer probes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
          components: miri, rust-src
      - name: Miri selected contract probe
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --manifest-path core/rust/Cargo.toml --lib --no-default-features resource::tests
      - name: Address sanitizer selected probe
        if: always()
        env:
          RUSTFLAGS: -Z sanitizer=address
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --manifest-path core/rust/Cargo.toml --lib --no-default-features resource::tests
