name: Hardware buffer evidence

"on":
  push:
    branches: [main]
    paths:
      - "core/python/bridge.py"
      - "core/python/bridge_mmap.py"
      - "core/rust/src/bridge_mmap.rs"
      - "core/rust/src/ffi.rs"
      - "core/rust/src/ffi/hot.rs"
      - "core/rust/src/ffi/mmap.rs"
      - "core/rust/src/hot_engine.rs"
      - "core/python/aegis/evidence.py"
      - "scripts/mmap_stream_buffer_benchmark.py"
      - "scripts/hot_buffer_ffi_benchmark.py"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/mmap-stream-buffer-benchmark.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/python/bridge.py"
      - "core/python/bridge_mmap.py"
      - "core/rust/src/bridge_mmap.rs"
      - "core/rust/src/ffi.rs"
      - "core/rust/src/ffi/hot.rs"
      - "core/rust/src/ffi/mmap.rs"
      - "core/rust/src/hot_engine.rs"
      - "core/python/aegis/evidence.py"
      - "scripts/mmap_stream_buffer_benchmark.py"
      - "scripts/hot_buffer_ffi_benchmark.py"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/mmap-stream-buffer-benchmark.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-mmap-stream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.12.9

jobs:
  benchmark:
    name: Hardware buffer benchmark (${{ matrix.platform-id }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform-id: ubuntu-latest
          - os: windows-latest
            platform-id: windows-latest
          - os: macos-14
            platform-id: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Install pinned uv
        run: python -m pip install --upgrade pip "uv==${{ env.UV_VERSION }}"
      - name: Resolve locked environment and native extension
        run: uv sync --locked --extra all --extra dev
      - name: Run bounded cross-platform stream measurement
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          uv run --locked --extra all --extra dev python scripts/mmap_stream_buffer_benchmark.py
          --payload-bytes 16777216 --payload-bytes 67108864 --repetitions 5
          --output artifacts/mmap-stream-buffer-${{ matrix.platform-id }}.json
      - name: Run bounded high-headroom stream measurement
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          uv run --locked --extra all --extra dev python scripts/mmap_stream_buffer_benchmark.py
          --payload-bytes 67108864 --repetitions 5 --file-chunk-bytes 8388608
          --output artifacts/mmap-stream-buffer-high-headroom-${{ matrix.platform-id }}.json
      - name: Verify pressure-aware chunk selection
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          uv run --locked --extra all --extra dev python -c
          "from core.python.bridge_mmap import DEFAULT_FILE_STREAM_CHUNK_BYTES, HIGH_HEADROOM_FILE_STREAM_CHUNK_BYTES, HIGH_HEADROOM_MIN_PAYLOAD_BYTES, MIN_FILE_STREAM_CHUNK_BYTES, recommended_file_stream_chunk_bytes;
          assert recommended_file_stream_chunk_bytes(available_bytes=9, capacity_bytes=100) == MIN_FILE_STREAM_CHUNK_BYTES;
          assert recommended_file_stream_chunk_bytes(available_bytes=24, capacity_bytes=100) == 256 * 1024;
          assert recommended_file_stream_chunk_bytes(available_bytes=25, capacity_bytes=100) == DEFAULT_FILE_STREAM_CHUNK_BYTES;
          assert recommended_file_stream_chunk_bytes(available_bytes=2 * 1024 * 1024 * 1024, capacity_bytes=4 * 1024 * 1024 * 1024, payload_bytes=HIGH_HEADROOM_MIN_PAYLOAD_BYTES) == HIGH_HEADROOM_FILE_STREAM_CHUNK_BYTES;
          print('pressure-aware chunk selection: PASS')"
      - name: Run bounded hot FFI boundary measurement
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          uv run --locked --extra all --extra dev python scripts/hot_buffer_ffi_benchmark.py
          --payload-bytes 4194304 --payload-bytes 16777216 --repetitions 5
          --output artifacts/hot-buffer-ffi-${{ matrix.platform-id }}.json
      - name: Bind evidence to commit and runner
        env:
          PLATFORM_ID: ${{ matrix.platform-id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          from datetime import UTC, datetime
          from pathlib import Path

          for prefix in ("mmap-stream-buffer", "mmap-stream-buffer-high-headroom", "hot-buffer-ffi"):
              path = Path("artifacts") / f"{prefix}-{os.environ['PLATFORM_ID']}.json"
              report = json.loads(path.read_text(encoding="utf-8"))
              report["evidence_binding"] = {
                  "commit_sha": os.environ["GITHUB_SHA"],
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "platform_id": os.environ["PLATFORM_ID"],
                  "runner_os": os.environ["RUNNER_OS"],
                  "runner_arch": os.environ["RUNNER_ARCH"],
                  "python_version": platform.python_version(),
                  "captured_at_utc": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              }
              path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print(json.dumps({"artifact": prefix, "platform": report["host"]["platform"], "status": report["status"]}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mmap-stream-buffer-${{ matrix.platform-id }}-${{ github.sha }}
          path: |
            artifacts/mmap-stream-buffer-${{ matrix.platform-id }}.json
            artifacts/mmap-stream-buffer-high-headroom-${{ matrix.platform-id }}.json
            artifacts/hot-buffer-ffi-${{ matrix.platform-id }}.json
          if-no-files-found: error
