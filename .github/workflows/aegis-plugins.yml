name: aegis-plugins

"on":
  pull_request:
    # Keep plugin CI focused on executable/build changes; docs are checked
    # locally and must not create notification-only runs.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AEGIS-COGNITION/**"
      - "planning pdf/**"
      - ".agents/**"
      - ".cursor/**"
      - ".serena/**"
      - "artifacts/**"
  push:
    branches: [main]
    # Keep plugin CI focused on executable/build changes; docs are checked
    # locally and must not create notification-only runs.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AEGIS-COGNITION/**"
      - "planning pdf/**"
      - ".agents/**"
      - ".cursor/**"
      - ".serena/**"
      - "artifacts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-plugins-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-workspace:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Windows target compile
        env:
          PYO3_PYTHON: python
        run: cargo check --workspace --target x86_64-pc-windows-msvc --lib --no-default-features
      - name: Test plugins
        env:
          PYO3_PYTHON: python
        run: cargo test --workspace --no-default-features
      - name: Clippy plugins
        env:
          PYO3_PYTHON: python
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
