name: License policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    name: Proprietary license policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify repository license boundary
        run: python scripts/license_policy.py
