name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    name: Rust tests (Ubuntu)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v4
      - name: Architecture fitness
        run: python scripts/architecture_fitness.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Tests
        env:
          PYO3_PYTHON: python3
        run: cargo test --lib --no-default-features
      - name: Clippy (unused_imports, dead_code)
        # These lint passes target the cleanup categories tracked in CHANGELOG.md.
        # Disallow regressions; informational style warnings remain warnings.
        env:
          PYO3_PYTHON: python3
        run: |
          cargo clippy --all-targets --no-default-features -- -W unused_imports -W dead_code 2>&1 \
            | tee clippy_clean.txt
          if grep -q "^warning: unused import" clippy_clean.txt; then
            echo "::error::Unused imports detected — see CHANGELOG.md [Unreleased] cleanup section."
            exit 1
          fi
          if grep -qE "^warning:.*function .* is never used|^warning:.*never read" clippy_clean.txt; then
            echo "::error::Dead code detected."
            exit 1
          fi
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Wasmtime migration gate
        run: python scripts/wasmtime_migration_gate.py

  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14.7', '3.15.0-rc.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Architecture fitness
        run: python scripts/architecture_fitness.py
      - name: Install
        run: python -m pip install --upgrade pip uv && uv sync --locked --extra all --extra dev
      - name: Tests
        run: uv run --locked --extra all --extra dev python -m pytest tests core/python/tests.py -v
      - name: Build maturin wheel
        run: uv build --wheel --out-dir artifacts/maturin
      - name: Inspect wheel contents
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import zipfile
          wheels = glob.glob("artifacts/maturin/*.whl")
          assert wheels, "maturin produced no wheel"
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
          assert any(name.startswith("aegis_cognition/") for name in names)
          assert any("aegis_nerve" in name for name in names)
          print(wheels[0])
          PY
