name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.12.9

jobs:
  change-scope:
    name: Classify changed inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
      documentation: ${{ steps.classify.outputs.documentation }}
      authority: ${{ steps.classify.outputs.authority }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify runtime, documentation, and evidence inputs
        id: classify
        shell: bash
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              changed_paths="$(git diff --name-only --no-renames "${PR_BASE_SHA}...${GITHUB_SHA}")"
              ;;
            push)
              if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                changed_paths=__all__
              else
                changed_paths="$(git diff --name-only --no-renames "$PUSH_BEFORE_SHA" "$GITHUB_SHA")"
              fi
              ;;
            *)
              changed_paths=__all__
              ;;
          esac

          runtime=false
          documentation=false
          authority=false
          if [[ "$changed_paths" == __all__ ]]; then
            runtime=true
            documentation=true
            authority=true
          else
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                docs/*|*.md) documentation=true ;;
              esac
              case "$path" in
                docs/architecture/evidence/current.json|\
                docs/architecture/not_verified_registry.json|\
                docs/architecture/deployment_policy.json|\
                docs/architecture/NOT_VERIFIED_REGISTRY.md|\
                docs/architecture/GT96_TRACEABILITY.md|\
                docs/architecture/GT96_TRACEABILITY_DETAIL.md|\
                docs/architecture/VERIFICATION_INDEX.md|\
                docs/architecture/document_inventory.json|\
                schemas/*.json|\
                quality/registry/*.json|\
                scripts/evidence_consistency_gate.py) authority=true ;;
              esac
              case "$path" in
                docs/*.py) runtime=true ;;
                docs/*|*.md|.agents/*|.aegis/*|artifacts/*|.local/*) ;;
                *) runtime=true ;;
              esac
            done <<< "$changed_paths"
          fi
          {
            printf 'runtime=%s\n' "$runtime"
            printf 'documentation=%s\n' "$documentation"
            printf 'authority=%s\n' "$authority"
          } >> "$GITHUB_OUTPUT"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Scan tracked and publishable worktree files
        run: python scripts/secret_scan.py

  documentation-contract:
    name: Documentation consistency
    runs-on: ubuntu-latest
    needs: change-scope
    if: ${{ needs.change-scope.result == 'success' && needs.change-scope.outputs.documentation == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Check documentation contracts
        run: python scripts/document_consistency_gate.py
      - name: Check architecture fitness and ADR completeness
        run: python scripts/architecture_fitness.py

  evidence-authority:
    name: Evidence authority consistency
    runs-on: ubuntu-latest
    needs: change-scope
    if: ${{ needs.change-scope.result == 'success' && needs.change-scope.outputs.authority == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Validate current evidence and blocker authorities
        run: python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json

  rust-fast-gate:
    name: Rust fast gate
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Architecture fitness
        run: python scripts/architecture_fitness.py
      - name: Document consistency
        run: python scripts/document_consistency_gate.py
      - name: AESE inventory drift
        run: python scripts/aese_inventory.py --check
      - name: AESE shadow graph drift
        run: python scripts/aese_claim_graph.py --check
      - name: Current evidence consistency
        run: python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Install Rust quality tools
        run: |
          if ! cargo nextest --version 2>/dev/null | grep -q "0.9.143"; then
            cargo install cargo-nextest --version 0.9.143 --locked --force
          fi
          if ! cargo deny --version 2>/dev/null | grep -q "0.20.2"; then
            cargo install cargo-deny --version 0.20.2 --locked --force
          fi
      - name: Workspace check
        env:
          PYO3_PYTHON: python3
        run: cargo check --all-targets --no-default-features
      - name: Default-member tests
        env:
          PYO3_PYTHON: python3
        run: python scripts/suite_evidence.py --name rust-default-members --output artifacts/suites/rust-default-members.json --status-output artifacts/suite-status/rust-default-members.json --owner-id ci-rust --gate-id rust-default-members --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 900 -- cargo nextest run --no-default-features
      - name: Bind final Rust suite evidence
        run: python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
      - name: Clippy strict gate
        env:
          PYO3_PYTHON: python3
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Dependency policy gate
        run: cargo deny --all-features check advisories bans licenses sources
      - name: Dependency lock gate
        run: python scripts/dependency_audit_gate.py
      - name: Wasmtime migration gate
        run: python scripts/wasmtime_migration_gate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-rust-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/suite-status/rust-default-members.json

  python-fast-gate:
    name: Python fast gate (${{ matrix.python-version }})
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.14.7'
          - python-version: '3.15.0-rc.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Install pinned uv
        run: python -m pip install --upgrade pip "uv==${{ env.UV_VERSION }}"
      - name: Architecture fitness
        run: python scripts/architecture_fitness.py
      - name: Document consistency
        run: python scripts/document_consistency_gate.py
      - name: Current evidence consistency
        run: python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
      - name: Resolve locked environment
        run: uv sync --locked --extra all --extra dev
      - name: Verify selected Python runtime
        run: >-
          uv run --locked --no-sync python -c
          "import os, platform, sys; expected = os.environ['UV_PYTHON'].replace('-rc.', 'rc');
          actual = platform.python_version();
          sys.exit(f'Expected Python {expected}, got {actual}') if actual != expected else print(f'Using Python {actual}')"
      - name: Ruff lint
        run: uv run --locked --extra all --extra dev ruff check aegis_cognition
      - name: Ruff format
        run: uv run --locked --extra all --extra dev ruff format --check aegis_cognition
      - name: Pyright strict type check
        run: uv run --locked --extra all --extra dev pyright
      - name: Python and cross-language tests
        run: python scripts/suite_evidence.py --name python-cross-language --output artifacts/suites/python-cross-language.json --status-output artifacts/suite-status/python-cross-language.json --owner-id ci-python --gate-id python-cross-language --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 900 -- uv run --locked --extra all --extra dev python -m pytest tests core/python/tests.py -v -W error::DeprecationWarning
      - name: Bind final Python suite evidence
        run: python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
      - name: Build maturin wheel
        run: uv build --wheel --out-dir artifacts/maturin
      - name: Inspect wheel contents
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import zipfile
          wheels = glob.glob("target/wheels/*.whl") + glob.glob("artifacts/maturin/*.whl")
          assert wheels, "maturin produced no wheel"
          with zipfile.ZipFile(wheels[-1]) as wheel:
              names = wheel.namelist()
          assert any(name.startswith("aegis_cognition/") for name in names)
          assert any("aegis_nerve" in name for name in names)
          assert any(name.startswith("core/python/") for name in names)
          print(wheels[-1])
          PY
      - name: Generate release hash and SBOM evidence
        run: |
          python -m py_compile scripts/release_evidence.py
          uv run --locked --extra all --extra dev ruff check scripts/release_evidence.py
          python scripts/release_evidence.py --artifacts artifacts/maturin --output artifacts/release-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-python-evidence-${{ matrix.python-version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/suite-status/python-cross-language.json

  rust-msrv:
    name: Rust MSRV (1.99.1)
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned compiler
        with:
          toolchain: 1.99.1
      - name: MSRV workspace check
        run: cargo check --workspace --all-targets --no-default-features --locked

  tier1-platform-smoke:
    name: Tier-1 platform smoke (${{ matrix.os }})
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.runtime == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Portable Rust library check
        env:
          PYO3_PYTHON: python
        run: cargo check --lib --no-default-features

  desktop-build:
    name: Desktop graph build (${{ matrix.os }})
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.runtime == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      UV_PYTHON: '3.14.7'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned compiler
        with:
          toolchain: 1.99.1
      - name: Install pinned uv
        run: python -m pip install --upgrade pip "uv==${{ env.UV_VERSION }}"
      - name: Resolve locked desktop sidecar environment
        run: uv sync --locked --extra all --extra dev --group desktop
      - name: Verify selected Python runtime
        run: >-
          uv run --locked --no-sync python -c
          "import os, platform, sys; expected = os.environ['UV_PYTHON'].replace('-rc.', 'rc');
          actual = platform.python_version();
          sys.exit(f'Expected Python {expected}, got {actual}') if actual != expected else print(f'Using Python {actual}')"
      - name: Test provider-scoped desktop model selection
        working-directory: desktop
        run: npm test
      - name: Build desktop graph surface
        working-directory: desktop
        run: npm run build
      - name: Install Chromium for desktop browser tests
        if: runner.os == 'Linux'
        working-directory: desktop
        run: npx playwright install --with-deps chromium
      - name: Test desktop capability setup flows
        if: runner.os == 'Linux'
        working-directory: desktop
        run: npx playwright test
      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Check Tauri host
        working-directory: desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Test Tauri host contracts
        working-directory: .
        run: python scripts/suite_evidence.py --name "tauri-host-contracts-${{ matrix.os }}" --output "artifacts/suites/tauri-host-contracts-${{ matrix.os }}.json" --status-output "artifacts/suite-status/tauri-host-contracts-${{ matrix.os }}.json" --owner-id ci-desktop --gate-id "tauri-host-contracts-${{ matrix.os }}" --platform-id "${{ matrix.os }}" --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 900 -- cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Upload Tauri host suite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-host-suite-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/suite-status/tauri-host-contracts-${{ matrix.os }}.json
          if-no-files-found: warn
      - name: Build desktop bundle and native sidecar
        working-directory: desktop
        run: npm run tauri:build

  cross-platform-full-suite:
    name: Full Python suite (${{ matrix.os }})
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.runtime == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: '3.14.7'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform-id: ubuntu-latest
          - os: windows-latest
            platform-id: windows-latest
          - os: macos-14
            platform-id: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Install pinned uv
        run: python -m pip install --upgrade pip "uv==${{ env.UV_VERSION }}"
      - name: Resolve locked environment
        run: uv sync --locked --extra all --extra dev
      - name: Verify selected Python runtime
        run: >-
          uv run --locked --no-sync python -c
          "import os, platform, sys; expected = os.environ['UV_PYTHON'].replace('-rc.', 'rc');
          actual = platform.python_version();
          sys.exit(f'Expected Python {expected}, got {actual}') if actual != expected else print(f'Using Python {actual}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: runner.os == 'Windows'
        with:
          node-version: 22.14.0
      - name: Windows platform contracts
        if: runner.os == 'Windows'
        run: python scripts/suite_evidence.py --name windows-platform-contracts --output artifacts/suites/windows-platform/windows.json --owner-id ci-windows-platform --gate-id windows-platform-contracts --platform-id windows-latest --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 300 -- uv run --locked --extra all --extra dev python -m pytest tests/platform/windows.py -v -W error::DeprecationWarning
      - name: Validate Windows platform evidence
        if: always() && runner.os == 'Windows'
        run: >-
          python scripts/cross_platform_evidence_gate.py
          --directory artifacts/suites/windows-platform
          --commit "${{ github.sha }}"
          --expected-platform windows-latest
          --command-fragment "uv run --locked --extra all --extra dev python -m pytest tests/platform/windows.py -v -W error::DeprecationWarning"
          --output artifacts/private/windows-platform-evidence.json
          --attestation-output artifacts/suite-status/windows-platform.json
      - name: Upload Windows platform evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-platform-suite-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/suite-status/windows-platform.json
          if-no-files-found: error
      - name: Full Python and cross-language suite
        run: python scripts/suite_evidence.py --name "cross-platform-full-suite-${{ matrix.platform-id }}" --output "artifacts/suites/cross-platform-${{ matrix.platform-id }}/evidence.json" --owner-id ci-cross-platform-${{ matrix.platform-id }} --gate-id cross-platform-full-suite-${{ matrix.platform-id }} --platform-id "${{ matrix.platform-id }}" --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 1200 -- uv run --locked --extra all --extra dev python -m pytest tests core/python/tests.py -v -W error::DeprecationWarning
      - name: Produce sanitized cross-platform lane attestation
        if: always()
        run: >-
          python scripts/cross_platform_evidence_gate.py
          --directory "artifacts/suites/cross-platform-${{ matrix.platform-id }}"
          --commit "${{ github.sha }}"
          --expected-platform "${{ matrix.platform-id }}"
          --command-fragment "uv run --locked --extra all --extra dev python -m pytest tests core/python/tests.py -v -W error::DeprecationWarning"
          --output "artifacts/private/cross-platform-${{ matrix.platform-id }}.json"
          --attestation-output "artifacts/suite-status/cross-platform-${{ matrix.platform-id }}.json"
      - name: Upload per-platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-platform-suite-${{ matrix.platform-id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/suite-status/cross-platform-${{ matrix.platform-id }}.json
          if-no-files-found: error

  cross-platform-evidence-gate:
    name: Cross-platform evidence gate
    runs-on: ubuntu-latest
    needs: [change-scope, cross-platform-full-suite]
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.runtime == 'true') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cross-platform-suite-*-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/cross-platform
          merge-multiple: true
      - name: Validate complete three-platform evidence
        run: >-
          python scripts/cross_platform_evidence_gate.py
          --directory artifacts/cross-platform
          --commit "${{ github.sha }}"
          --expected-platform ubuntu-latest
          --expected-platform windows-latest
          --expected-platform macos-14
          --command-fragment "uv run --locked --extra all --extra dev python -m pytest tests core/python/tests.py -v -W error::DeprecationWarning"
          --require-attestations
          --output artifacts/suite-status/cross-platform.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cross-platform-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/suite-status/cross-platform.json
          if-no-files-found: error

  wheel-parity:
    name: Tier-1 wheel parity (${{ matrix.os }})
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.runtime == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.14.7'
          - os: windows-latest
            python-version: '3.14.7'
          - os: macos-14
            python-version: '3.14.7'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned compiler
        with:
          toolchain: 1.99.1
      - name: Install pinned uv
        run: python -m pip install --upgrade pip "uv==${{ env.UV_VERSION }}"
      - name: Resolve locked environment
        run: uv sync --locked --extra all --extra dev
      - name: Verify selected Python runtime
        run: >-
          uv run --locked --no-sync python -c
          "import os, platform, sys; expected = os.environ['UV_PYTHON'].replace('-rc.', 'rc');
          actual = platform.python_version();
          sys.exit(f'Expected Python {expected}, got {actual}') if actual != expected else print(f'Using Python {actual}')"
      - name: Build wheel
        run: uv build --wheel --out-dir artifacts/wheels
      - name: Execute bounded WASM plugin runtime tests
        env:
          PYO3_PYTHON: python
        run: python scripts/suite_evidence.py --name "wasm-plugin-runtime-${{ matrix.os }}" --output "artifacts/suites/wasm-plugin-runtime-${{ matrix.os }}.json" --status-output "artifacts/suite-status/wasm-plugin-runtime-${{ matrix.os }}.json" --owner-id ci-rust --gate-id "wasm-plugin-runtime-${{ matrix.os }}" --platform-id "${{ matrix.os }}" --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 900 -- cargo test --locked --release -p aegis-nerve --features wasm-plugins --lib wasm_plugins::tests
      - name: Upload WASM plugin suite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-plugin-suite-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/suite-status/wasm-plugin-runtime-${{ matrix.os }}.json
          if-no-files-found: warn
      - name: Clean install/import/native metadata smoke
        shell: bash
        run: |
          python -m venv .wheel-smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            python_bin="$PWD/.wheel-smoke/Scripts/python"
          else
            python_bin="$PWD/.wheel-smoke/bin/python"
          fi
          "$python_bin" -m pip install artifacts/wheels/*.whl
          (
            cd .wheel-smoke
            "$python_bin" - <<'PY'
          import importlib.metadata as metadata
          from aegis_cognition import aegis_nerve as native

          assert callable(getattr(native, "WasmPlugin", None)), "WASM plugin runtime missing from wheel"
          try:
              native.WasmPlugin(b"\x00asm" + b"\x00" * (16 * 1024 * 1024))
          except ValueError as error:
              assert "module exceeds its input limit" in str(error)
          else:
              raise AssertionError("WasmPlugin accepted an oversized module")
          print(metadata.version("aegis-cognition"))
          PY
          )

  rust-beta-forward-compat:
    name: Rust beta forward compatibility
    needs: change-scope
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # beta
        with:
          toolchain: beta
          components: rustfmt, clippy
      - name: Beta format and compile probe
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets --no-default-features
          cargo clippy --all-targets --no-default-features -- -D warnings
