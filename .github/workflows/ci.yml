name: CI

"on":
  push:
    branches: [main]
    # Documentation/evidence-only commits are checked locally; avoid starting
    # the full matrix when no executable or build input changed.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
      - ".aegis/**"
      - "artifacts/**"
      - ".local/**"
  pull_request:
    branches: [main]
    # Documentation/evidence-only changes do not need the runtime matrix.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
      - ".aegis/**"
      - "artifacts/**"
      - ".local/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.12.9

jobs:
  rust-fast-gate:
    name: Rust fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Architecture fitness
        run: python scripts/architecture_fitness.py
      - name: Document consistency
        run: python scripts/document_consistency_gate.py
      - name: AESE inventory drift
        run: python scripts/aese_inventory.py --check
      - name: AESE shadow graph drift
        run: python scripts/aese_claim_graph.py --check
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Current evidence consistency
        run: python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Install Rust quality tools
        run: |
          if ! cargo nextest --version 2>/dev/null | grep -q "0.9.143"; then
            cargo install cargo-nextest --version 0.9.143 --locked --force
          fi
          if ! cargo deny --version 2>/dev/null | grep -q "0.20.2"; then
            cargo install cargo-deny --version 0.20.2 --locked --force
          fi
      - name: Workspace check
        env:
          PYO3_PYTHON: python3
        run: cargo check --all-targets --no-default-features
      - name: Default-member tests
        env:
          PYO3_PYTHON: python3
        run: python scripts/suite_evidence.py --name rust-default-members --output artifacts/suites/rust-default-members.json --owner-id ci-rust --gate-id rust-default-members --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 900 -- cargo nextest run --no-default-features
      - name: Bind final Rust suite evidence
        run: python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
      - name: Clippy strict gate
        env:
          PYO3_PYTHON: python3
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Dependency policy gate
        run: cargo deny check advisories bans licenses sources
      - name: Dependency lock gate
        run: python scripts/dependency_audit_gate.py
      - name: Wasmtime migration gate
        run: python scripts/wasmtime_migration_gate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-rust-evidence-${{ github.sha }}
          path: |
            artifacts/evidence/current.json
            artifacts/suites

  python-fast-gate:
    name: Python fast gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.14.7'
            experimental: false
            freethreaded: false
          - python-version: '3.15.0-rc.1'
            experimental: false
            freethreaded: false
          - python-version: '3.14.7'
            experimental: true
            freethreaded: true
          - python-version: '3.15.0-rc.1'
            experimental: true
            freethreaded: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          freethreaded: ${{ matrix.freethreaded }}
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Install pinned uv
        run: python -m pip install --upgrade pip "uv==${{ env.UV_VERSION }}"
      - name: Architecture fitness
        run: python scripts/architecture_fitness.py
      - name: Document consistency
        run: python scripts/document_consistency_gate.py
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Current evidence consistency
        run: python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
      - name: Resolve locked environment
        run: uv sync --locked --extra all --extra dev
      - name: Ruff lint
        run: uv run --locked --extra all --extra dev ruff check aegis_cognition
      - name: Ruff format
        run: uv run --locked --extra all --extra dev ruff format --check aegis_cognition
      - name: Pyright strict type check
        run: uv run --locked --extra all --extra dev pyright
      - name: Python and cross-language tests
        run: python scripts/suite_evidence.py --name python-cross-language --output artifacts/suites/python-cross-language.json --owner-id ci-python --gate-id python-cross-language --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 900 -- uv run --locked --extra all --extra dev python -m pytest tests core/python/tests.py -v -W error::DeprecationWarning
      - name: Bind final Python suite evidence
        run: python scripts/evidence_consistency_gate.py --generate artifacts/evidence/current.json
      - name: Build maturin wheel
        run: uv build --wheel --out-dir artifacts/maturin
      - name: Inspect wheel contents
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import zipfile
          wheels = glob.glob("target/wheels/*.whl") + glob.glob("artifacts/maturin/*.whl")
          assert wheels, "maturin produced no wheel"
          with zipfile.ZipFile(wheels[-1]) as wheel:
              names = wheel.namelist()
          assert any(name.startswith("aegis_cognition/") for name in names)
          assert any("aegis_nerve" in name for name in names)
          assert any(name.startswith("core/python/") for name in names)
          print(wheels[-1])
          PY
      - name: Generate release hash and SBOM evidence
        run: |
          python -m py_compile scripts/release_evidence.py
          uv run --locked --extra all --extra dev ruff check scripts/release_evidence.py
          python scripts/release_evidence.py --artifacts artifacts/maturin --output artifacts/release-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-python-evidence-${{ github.sha }}
          path: |
            artifacts/evidence/current.json
            artifacts/suites

  rust-msrv:
    name: Rust MSRV (1.98.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned compiler
        with:
          toolchain: 1.98.1
      - name: MSRV workspace check
        run: cargo check --workspace --all-targets --no-default-features --locked

  tier1-platform-smoke:
    name: Tier-1 platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Portable Rust library check
        env:
          PYO3_PYTHON: python
        run: cargo check --lib --no-default-features

  desktop-build:
    name: Desktop graph build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Build desktop graph surface
        working-directory: desktop
        run: npm run build

  cross-platform-full-suite:
    name: Full Python suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform-id: ubuntu-latest
          - os: windows-latest
            platform-id: windows-latest
          - os: macos-14
            platform-id: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(python scripts/rust_toolchain.py)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Install pinned uv
        run: python -m pip install --upgrade pip "uv==${{ env.UV_VERSION }}"
      - name: Resolve locked environment
        run: uv sync --locked --extra all --extra dev
      - name: Full Python and cross-language suite
        run: python scripts/suite_evidence.py --name "cross-platform-full-suite-${{ matrix.platform-id }}" --output "artifacts/suites/cross-platform-${{ matrix.platform-id }}.json" --owner-id ci-cross-platform-${{ matrix.platform-id }} --gate-id cross-platform-full-suite-${{ matrix.platform-id }} --platform-id "${{ matrix.platform-id }}" --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" --timeout-seconds 1200 -- uv run --locked --extra all --extra dev python -m pytest tests core/python/tests.py -v -W error::DeprecationWarning
      - name: Upload per-platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-platform-suite-${{ matrix.platform-id }}-${{ github.sha }}
          path: artifacts/suites/cross-platform-${{ matrix.platform-id }}.json
          if-no-files-found: error

  cross-platform-evidence-gate:
    name: Cross-platform evidence gate
    runs-on: ubuntu-latest
    needs: cross-platform-full-suite
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cross-platform-suite-*-${{ github.sha }}
          path: artifacts/cross-platform
          merge-multiple: true
      - name: Validate complete three-platform evidence
        run: >-
          python scripts/cross_platform_evidence_gate.py
          --directory artifacts/cross-platform
          --commit "${{ github.sha }}"
          --expected-platform ubuntu-latest
          --expected-platform windows-latest
          --expected-platform macos-14
          --command-fragment "uv run --locked --extra all --extra dev python -m pytest tests core/python/tests.py -v -W error::DeprecationWarning"
          --output artifacts/cross-platform/evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cross-platform-evidence-${{ github.sha }}
          path: artifacts/cross-platform/evidence.json
          if-no-files-found: error

  wheel-parity:
    name: Tier-1 wheel parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.14.7'
          - os: windows-latest
            python-version: '3.14.7'
          - os: macos-14
            python-version: '3.14.7'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned compiler
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install pinned uv
        run: python -m pip install --upgrade pip "uv==${{ env.UV_VERSION }}"
      - name: Resolve locked environment and build wheel
        run: |
          uv sync --locked --extra all --extra dev
          uv build --wheel --out-dir artifacts/wheels
      - name: Clean install/import/native metadata smoke
        shell: bash
        run: |
          python -m venv .wheel-smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            .wheel-smoke/Scripts/python -m pip install artifacts/wheels/*.whl
            (cd .wheel-smoke && ./Scripts/python -c "import importlib.metadata as m; import aegis_cognition; print(m.version('aegis-cognition'))")
          else
            .wheel-smoke/bin/python -m pip install artifacts/wheels/*.whl
            (cd .wheel-smoke && ./bin/python -c "import importlib.metadata as m; import aegis_cognition; print(m.version('aegis-cognition'))")
          fi

  rust-beta-forward-compat:
    name: Rust beta forward compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # beta
        with:
          toolchain: beta
          components: rustfmt, clippy
      - name: Beta format and compile probe
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets --no-default-features
          cargo clippy --all-targets --no-default-features -- -D warnings
