name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    name: Rust tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Architecture fitness
        run: python scripts/architecture_fitness.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Tests
        run: cargo test --lib
      - name: Clippy (unused_imports, dead_code)
        # These lint passes target the cleanup categories tracked in CHANGELOG.md.
        # Disallow regressions; informational style warnings remain warnings.
        run: |
          cargo clippy --all-targets --all-features -- -W unused_imports -W dead_code 2>&1 \
            | tee clippy_clean.txt
          if grep -q "^warning: unused import" clippy_clean.txt; then
            echo "::error::Unused imports detected — see CHANGELOG.md [Unreleased] cleanup section."
            exit 1
          fi
          if grep -qE "^warning:.*function .* is never used|^warning:.*never read" clippy_clean.txt; then
            echo "::error::Dead code detected."
            exit 1
          fi
      - name: Format check
        # The legacy crate has pre-existing format drift outside this change.
        # Keep the gate strict for the touched Rust boundary and new contracts.
        run: rustfmt --edition 2021 --check core/rust/src/resource.rs core/rust/src/runtime.rs core/rust/src/ffi.rs

  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Architecture fitness
        run: python scripts/architecture_fitness.py
      - name: Install
        run: python -m pip install --upgrade pip uv && uv sync --locked --extra all --extra dev
      - name: Tests
        run: python -m pytest tests core/python/tests.py -v
