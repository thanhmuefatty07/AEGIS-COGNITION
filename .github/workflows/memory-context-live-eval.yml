name: Memory context live model evaluation

"on":
  workflow_dispatch:
    inputs:
      provider:
        description: Provider set to call
        required: false
        default: auto
        type: choice
        options:
          - auto
          - openrouter
          - nvidia
          - "openrouter,nvidia"
      openrouter_models:
        description: OpenRouter model id(s), comma-separated; use explicit :free ids for paired evidence
        required: false
        default: openrouter/free
        type: string
      nvidia_models:
        description: NVIDIA NIM model id(s), comma-separated
        required: false
        default: deepseek-ai/deepseek-v4-flash
        type: string
      repeats:
        description: Repeated baseline/bounded pairs (1-3)
        required: false
        default: "1"
        type: string
      max_requests:
        description: Safety ceiling for planned requests (1-96)
        required: false
        default: "24"
        type: string
      delay_ms:
        description: Delay between provider requests in milliseconds (2400 is about 25 RPM)
        required: false
        default: "2400"
        type: string
      dry_run:
        description: Validate workflow and artifact plumbing without provider calls
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aegis-memory-context-live-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.12.9

jobs:
  live-evaluation:
    name: Hosted model comparison
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVAL_PROVIDER: ${{ inputs.provider }}
      EVAL_OPENROUTER_MODELS: ${{ inputs.openrouter_models }}
      EVAL_NVIDIA_MODELS: ${{ inputs.nvidia_models }}
      EVAL_REPEATS: ${{ inputs.repeats }}
      EVAL_MAX_REQUESTS: ${{ inputs.max_requests }}
      EVAL_DELAY_MS: ${{ inputs.delay_ms }}
      EVAL_DRY_RUN: ${{ inputs.dry_run }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"
      - name: Install pinned uv
        run: python -m pip install --upgrade pip "uv==${{ env.UV_VERSION }}"
      - name: Resolve locked environment without compiling the package
        run: uv sync --locked --extra all --extra dev --no-install-project
      - name: Run opt-in live evaluation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p artifacts
          eval_args=( \
            --provider "$EVAL_PROVIDER" \
            --openrouter-models "$EVAL_OPENROUTER_MODELS" \
            --nvidia-models "$EVAL_NVIDIA_MODELS" \
            --repeats "$EVAL_REPEATS" \
            --max-requests "$EVAL_MAX_REQUESTS" \
            --delay-ms "$EVAL_DELAY_MS" \
            --output artifacts/memory-context-live-eval.json \
          )
          if [[ "$EVAL_DRY_RUN" == "true" ]]; then
            eval_args+=(--dry-run)
          fi
          uv run --no-project --no-sync --locked --extra all --extra dev python scripts/memory_context_live_eval.py "${eval_args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: memory-context-live-eval-${{ github.sha }}
          path: artifacts/memory-context-live-eval.json
          if-no-files-found: error
