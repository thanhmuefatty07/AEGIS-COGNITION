[package]
name = "aegis-nerve"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
license-file = "../../LICENSE.txt"
repository = "https://github.com/thanhmuefatty07/AEGIS-COGNITION"

[lib]
name = "aegis_nerve"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aegis-nerve-cli"
path = "src/main.rs"

[[bench]]
name = "nerve_bench"
harness = false

[[bench]]
name = "shadow_sealer_throughput"
harness = false

[[bench]]
name = "skill_improvement"
harness = false

[[bench]]
name = "resource_runtime"
harness = false

[[bench]]
name = "architecture_performance"
harness = false

[features]
default = []
python-extension = ["pyo3/extension-module"]
wasm-plugins = ["dep:wasmparser"]
network-h3 = []
fast-json = []

[dependencies]
thiserror = "2"
memmap2 = "0.9"
notify = "8.2.0"
parking_lot = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
pyo3 = { version = "0.29.2", features = ["macros"] }
arrow = "60"
arrow-buffer = "60"
flatbuffers = "25.12"
syn = { version = "2.0", features = ["full", "parsing", "printing", "clone-impls", "visit", "visit-mut"] }
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = { version = "=50.0.3", default-features = false, features = ["cranelift", "pooling-allocator", "parallel-compilation", "runtime", "std"] }
wasmparser = { version = "=0.261.0", optional = true }
wat = "=1.261.0"
blake3 = "1.8"
xxhash-rust = { version = "0.8.10", features = ["xxh3"] }
aho-corasick = "1.1.2"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "fs", "io-util", "time"] }
rayon = "1.12"
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }


[dev-dependencies]
tempfile = "3"
criterion = "0.5"
proptest = "1.4.0"
